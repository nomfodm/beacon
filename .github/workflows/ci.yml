name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pytest tests/unit --tb=short --cov=src --cov-report=term-missing

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: infinity
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
        options: >-
          --health-cmd "pg_isready -U postgres -d infinity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run alembic upgrade head
        env:
          DATABASE__URL: postgresql+asyncpg://postgres:pass@localhost:5432/infinity
      - run: uv run alembic check
        env:
          DATABASE__URL: postgresql+asyncpg://postgres:pass@localhost:5432/infinity
      - run: uv run pytest tests/integration --tb=short
